<!doctype html><html lang="en-ZA"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><!-- The product's bars are the surface role since the Lovable identity of 28 September 2026. The page is light whatever the system says (lib/theme.ts, 29 September 2026), so there is one theme-color and no prefers-color-scheme variant: it is tokens.json#semantic.light.surface, written out because a meta attribute cannot read a CSS custom property, and data-role names the custom property lib/theme.ts reads it from again when a person turns dark on. --><meta name="theme-color" content="#ffffff" data-role="color-surface"/><meta name="description" content="MyThuso — help, health and care at home. Interactive design preview."/><!-- The map's two providers, and why both are named although only one draws. The policy is static HTML a browser reads before any script runs, so it cannot learn which tile source the build was made with; api.mapbox.com and *.tiles.mapbox.com are allowed under connect-src and img-src whether or not VITE_MAPBOX_TOKEN was set, and nothing asks them unless it was (packages/catalog/geography.json, rendering.alternateSources). script-src and worker-src stay 'self': a provider is a place to fetch tiles from, never a place to run code from. events.mapbox.com is deliberately absent — MapLibre carries no telemetry, this build sends none, and this line is what makes that a refusal. --><!-- img-src blob: since 2 October 2026: the skin check shows her photo back from an object URL made in this page and revoked when it goes, and without it the photo never drew — the screen showed its alt text, and the photo reader had no picture to make a still from. An object URL is this page's own memory, never another origin. --><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com https://*.tiles.mapbox.com; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: https://tiles.openfreemap.org https://api.mapbox.com https://*.tiles.mapbox.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"/><link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin/><link rel="icon" href="/icon.svg"/><title>MyThuso · Your care, connected</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
