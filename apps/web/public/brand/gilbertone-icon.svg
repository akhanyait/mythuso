  <g transform="translate(76 66) scale(1.8)">
    <circle cx="100" cy="22" r="10" fill="#FF6B35"/>
    <rect x="96" y="30" width="8" height="18" rx="4" fill="#0F3B4A"/>
    <rect x="34" y="88" width="18" height="46" rx="9" fill="#1D9E75"/>
    <rect x="148" y="88" width="18" height="46" rx="9" fill="#1D9E75"/>
    <rect x="48" y="46" width="104" height="118" rx="48" fill="#0F3B4A"/>
    <rect x="64" y="64" width="72" height="62" rx="31" fill="#E6FAF6"/>
    <circle cx="84" cy="92" r="7.5" fill="#0F3B4A"/>
    <circle cx="116" cy="92" r="7.5" fill="#0F3B4A"/>
    <path d="M 86 108 Q 100 121 114 108" fill="none" stroke="#0F3B4A" stroke-width="6" stroke-linecap="round"/>
    <rect x="84" y="140" width="32" height="6" rx="3" fill="#D9FF1A"/>
