<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-label="GilbertOne">
  <!-- For the brand ink and other dark grounds: the head in paper, the visor in ink, the ear pods and the name's
       "One" in lime, the antenna still orange. Transparent behind, so it sits on any dark surface. -->
  <g transform="translate(8 10) scale(0.5)">
    <circle cx="100" cy="22" r="10" fill="#FF6B35"/>
    <rect x="96" y="30" width="8" height="18" rx="4" fill="#F5F4EF"/>
    <rect x="34" y="88" width="18" height="46" rx="9" fill="#D9FF1A"/>
    <rect x="148" y="88" width="18" height="46" rx="9" fill="#D9FF1A"/>
    <rect x="48" y="46" width="104" height="118" rx="48" fill="#F5F4EF"/>
    <rect x="64" y="64" width="72" height="62" rx="31" fill="#0F3B4A"/>
    <circle cx="84" cy="92" r="7.5" fill="#F5F4EF"/>
    <circle cx="116" cy="92" r="7.5" fill="#F5F4EF"/>
    <path d="M 86 108 Q 100 121 114 108" fill="none" stroke="#F5F4EF" stroke-width="6" stroke-linecap="round"/>
    <rect x="84" y="140" width="32" height="6" rx="3" fill="#1D9E75"/>
  </g>
  <text x="122" y="82" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="62" font-weight="800" letter-spacing="-1.8" fill="#F5F4EF">Gilbert<tspan fill="#D9FF1A">One</tspan></text>
</svg>
