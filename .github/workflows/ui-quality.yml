name: UI quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build
      # The patient entry's weight, measured against the ceiling in CLAUDE.md. After the build and
      # not before it: it measures bytes that only exist once apps/web/dist has been written, and a
      # check that fails because nobody built yet is a check people learn to ignore. It is its own
      # script rather than a rule in check-boundaries.mjs for the same reason — those read the
      # source tree and need no build, so folding this in would make `npm run check` depend on one.
      #
      # This is the gate that keeps the dynamic-import discipline from eroding one import at a time.
      # Eleven engines of product across two waves cost the patient's first view nothing because
      # every one of them is behind a lazy import, and the mechanism that undoes it is invisible in
      # review: a static import of a shell from anything this entry already reaches pulls the whole
      # workspace back into the first load, and the build still succeeds.
      - run: node scripts/check-bundle-budget.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w @mythuso/api
      - run: npm run test -w @mythuso/api
      # the sign-in loop end to end, through the app's own /api proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run api & for i in $(seq 1 40); do curl -sf http://127.0.0.1:8787/health && break || sleep 0.5; done
      - run: npm run test:live
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project apps/ios/MyThuso.xcodeproj -scheme MyThuso -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      # The accessibility and booking journeys, on a simulator, because a test target nobody runs
      # is the same gap one level up. The device is chosen from what the runner actually has
      # rather than named: a hard-coded iPhone model is a job that goes red on the day GitHub
      # changes its image, and a red build for that reason is a build people stop reading.
      - name: Choose an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$udid" || { echo "no iPhone simulator on this runner"; xcrun simctl list devices available; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: xcodebuild test -project apps/ios/MyThuso.xcodeproj -scheme MyThuso -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd apps/android && ./gradlew :app:assembleDebug :app:lintDebug
