name: UI quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project apps/ios/MyThuso.xcodeproj -scheme MyThuso -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: cd apps/android && ./gradlew :app:assembleDebug :app:lintDebug
