name: UI quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the API locks are compared with their git history, and the dates below
      # are read from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check-boundaries.mjs decides a generated file is stale when it is older than its source, which
      # is right on a contributor's machine and meaningless on a fresh checkout, where every file is
      # dated by when the runner happened to write it. So each file first takes the date of the last
      # commit that touched it, then every text generator runs again: a generated file that comes out
      # different from the committed one fails the diff below, which is a stronger check than a date,
      # and one that comes out the same is now dated after its source. The image generators (banners,
      # the app icon) are left out: their bytes depend on the Pillow and Chromium on the runner, so
      # they are judged by their committed dates alone.
      - name: Date each file by its last commit, regenerate the generated text, and prove nothing moved
        run: |
          python3 - <<'PY'
          import os, subprocess
          log = subprocess.run(['git', '-c', 'core.quotePath=false', 'log', '--format=@%ct', '--name-only', '--no-renames'], capture_output=True, text=True, check=True).stdout
          seen, when = set(), None
          for line in log.splitlines():
              if line.startswith('@'):
                  when = int(line[1:])
              elif line and line not in seen:
                  seen.add(line)
                  if os.path.isfile(line):
                      os.utime(line, (when, when))
          PY
          for step in $(node -e "console.log(require('./package.json').scripts.generate.split(' && ').map(s => s.split(' ').pop()).filter(s => !['banners', 'appicon'].includes(s)).join(' '))"); do
            npm run -s "$step" > /dev/null
          done
          git diff --exit-code
      - run: npm run check && npm run build
      # The patient entry's weight, measured against the ceiling in CLAUDE.md. After the build and
      # not before it: it measures bytes that only exist once apps/web/dist has been written, and a
      # check that fails because nobody built yet is a check people learn to ignore. It is its own
      # script rather than a rule in check-boundaries.mjs for the same reason — those read the
      # source tree and need no build, so folding this in would make `npm run check` depend on one.
      #
      # This is the gate that keeps the dynamic-import discipline from eroding one import at a time.
      # Eleven engines of product across two waves cost the patient's first view nothing because
      # every one of them is behind a lazy import, and the mechanism that undoes it is invisible in
      # review: a static import of a shell from anything this entry already reaches pulls the whole
      # workspace back into the first load, and the build still succeeds.
      - run: node scripts/check-bundle-budget.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check -w @mythuso/api
      - run: npm run test -w @mythuso/api
      # the sign-in loop end to end, through the app's own /api proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run api & for i in $(seq 1 40); do curl -sf http://127.0.0.1:8787/health && break || sleep 0.5; done
      - run: npm run test:live
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project apps/ios/MyThuso.xcodeproj -scheme MyThuso -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      # The accessibility and booking journeys, on a simulator, because a test target nobody runs
      # is the same gap one level up. The device is chosen from what the runner actually has
      # rather than named: a hard-coded iPhone model is a job that goes red on the day GitHub
      # changes its image, and a red build for that reason is a build people stop reading.
      - name: Choose an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$udid" || { echo "no iPhone simulator on this runner"; xcrun simctl list devices available; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: xcodebuild test -project apps/ios/MyThuso.xcodeproj -scheme MyThuso -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The action's default package list still names the SDK's long-retired "tools" package, which the
      # repository no longer serves, and sdkmanager fails on it before Gradle runs.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: cd apps/android && ./gradlew :app:assembleDebug :app:lintDebug
