# MyThuso — public landing page at /, and one path per audience:
#
#   /        the public landing page
#   /app     the product: patients and families, and behind a role on the demo login, the clinical
#            workspaces and the back office
#   /status  what is connected and what is not, for anyone deciding whether to trust it
#
# Three builds, three bundles, one host — the three entries in apps/web/vite.config.ts, and every one
# of them has to be reachable or the entry is a build nobody can open. Paths rather than subdomains
# only because a second name needs its own certificate; the split into separate server blocks is
# written up in deploy/README.md as the change to make when there is one.
#
# There were five. /staff and /admin were applications of their own with a sign-in screen each, and
# both screens said the same thing — there is no account to sign in to — before asking the reader to
# pick a workspace anyway. The founder replaced all of it with one door, so those two paths are 301s
# now rather than entries: an old bookmark lands on the door instead of on a 404.
#
# That was never access control and is not offered as any. It was two unlisted paths with a noindex
# in their <head>, which stopped a crawler and nobody else; the workspaces are one press from the
# patient application now and the notice on the demo login says, in the contract's own words, that
# choosing a role grants nothing. Real access control arrives with real accounts, and
# packages/catalog/capabilities.json is where you can read that it has not.
#
# Added as its own file; no existing site on this host is touched.

# ── How long each kind of thing may be cached, computed once ───────────────────────────────────
#
# This is a map rather than a Cache-Control on each location because of one nginx rule that is easy
# to be bitten by and impossible to see afterwards: add_header is inherited from an outer level only
# if the inner level declares *none* of its own. A location that set its own Cache-Control with
# add_header therefore dropped every security header this file sets at the server level, silently,
# with the page still rendering exactly as before. That is what /assets/, /fonts/ and a
# `~* \.html$` block used to do here, so /status.html and every other .html URL was served with no
# X-Frame-Options at all.
#
# Deciding the value here and adding it once, at the server level, means no location in this file
# declares an add_header, so no location can drop part of the set. A number lives in one place.
map $uri $mythuso_cache {
    # HTML is the entry point to a build whose asset names are hashed. Caching it is how a browser
    # keeps loading last week's bundle after a deploy has replaced it.
    default                                     "no-store";
    ~^/assets/                                  "public, max-age=31536000, immutable";
    # The font files are not content-hashed, so they get a month rather than a year: long enough
    # that nobody downloads them twice, short enough that replacing a typeface actually lands.
    ~^/fonts/                                   "public, max-age=2592000";
    # Logos and banners are replaced by hand and rarely. A week is a compromise between a patient
    # on metered data and a brand change that has to show up without anybody clearing a cache.
    "~*\.(svg|png|jpe?g|webp|avif|gif|ico)$"    "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    root /var/www/mythuso;
    index landing.html;

    access_log /var/log/nginx/mythuso.access.log;
    error_log  /var/log/nginx/mythuso.error.log;

    # The app holds no real data yet, but these cost nothing and are wrong to add later. The whole
    # set is declared here and nowhere else in this file, for the inheritance reason above.
    #
    # frame-ancestors is here as well as X-Frame-Options because every entry carries its CSP in a
    # <meta http-equiv>, and frame-ancestors is one of the few directives a meta tag cannot express.
    # A header is the only place it can be said, and it is the same refusal the identity service
    # already sends from apps/api/src/server.ts.
    add_header Cache-Control $mythuso_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # HSTS, switched on 10 September 2026 after https was seen working on both names — and switched
    # on at five minutes rather than at two years, deliberately. The whole hazard of this header is
    # that it cannot be withdrawn from a browser that already heard it, so the first value shipped is
    # one that expires before anybody could be hurt by it. Raise it to 63072000 only once
    # `curl -sI https://mythuso.co.za/ | grep -i strict-transport` has shown it landing in the block
    # certbot writes, and once every subdomain still answers https — includeSubDomains binds them
    # too, and mail.mythuso.co.za and webmail.mythuso.co.za were checked before this line was written
    # (both serve a valid certificate; webmail already redirects http to https). It does not touch
    # SMTP or IMAP, which are not http and never see this header.
    #
    # No `preload`. A preload entry is a submission to a list this project cannot withdraw itself
    # from, which is the same mistake as a two-year max-age with the ink still wet.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    location = /      { try_files /landing.html =404; }
    location = /app   { return 301 /app/; }
    location /app/    { try_files /index.html =404; }
    # The two addresses that used to be applications. A permanent redirect rather than a gone: the
    # workspaces they named are still here, one press inside the door, so sending a reader there is
    # the true answer and a 404 would not be.
    location = /staff { return 301 /app/; }
    location /staff/  { return 301 /app/; }
    location = /admin { return 301 /app/; }
    location /admin/  { return 301 /app/; }
    # The page that says what is switched on and what is not — the one a funder is sent to. It needs
    # its own block for the same reason as the others: without one it fell through to the catch-all
    # at the bottom and answered /status with the landing page and a 200, which is a wrong answer
    # wearing a right one's status code.
    location = /status { return 301 /status/; }
    location /status/  { try_files /status.html =404; }

    location /assets/ { try_files $uri =404; }
    location /fonts/  { try_files $uri =404; }

    # The identity service, when it is running. Same origin, so the session cookie stays first-party
    # and the page's connect-src can stay 'self'. Commented out until TLS and an SMS provider exist:
    # a one-time-code service must not be reachable over plain http.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8787/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     # apps/api/src/server.ts sets its own transport headers, and stricter ones than this file:
    #     # default-src 'none', cross-origin-resource-policy and cross-origin-opener-policy as well.
    #     # Because add_header is inherited only by a level declaring none of its own, this one line
    #     # is what stops nginx appending a second X-Frame-Options and a second Permissions-Policy
    #     # on top of the service's. Two X-Frame-Options headers is not twice the protection — a
    #     # browser reading "DENY, DENY" is entitled to make nothing of either. Keep a header here.
    #     add_header X-Robots-Tag "noindex, nofollow" always;
    # }

    location / { try_files $uri $uri/ /landing.html; }
}
