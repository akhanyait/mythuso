# MyThuso — public landing page at /, and one path per audience:
#
#   /        the public landing page
#   /app     patients and families
#   /staff   nurse, doctor, pharmacy partner, Control Tower
#   /admin   the back office
#
# Four builds, four bundles, one host. Paths rather than subdomains only because mythuso.co.za's
# DNS has not moved yet and a second name needs its own certificate; the split into separate
# server blocks is written up in deploy/README.md as the change to make when it has. Nothing about
# the applications changes when it does — they are already four separate entries.
#
# /staff and /admin are noindex in their own <head> and are not linked from the landing page. That
# is not access control and is not offered as any: neither has an account behind it yet, which is
# what the notice on both sign-in screens says.
#
# Added as its own file; no existing site on this host is touched.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    root /var/www/mythuso;
    index landing.html;

    access_log /var/log/nginx/mythuso.access.log;
    error_log  /var/log/nginx/mythuso.error.log;

    # The app holds no real data yet, but these cost nothing and are wrong to add later.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location = / { try_files /landing.html =404; }
    location = /app { return 301 /app/; }
    location /app/ { try_files /index.html =404; }
    location = /staff { return 301 /staff/; }
    location /staff/ { try_files /staff.html =404; }
    location = /admin { return 301 /admin/; }
    location /admin/ { try_files /admin.html =404; }

    # The font files are not content-hashed, so they get a month rather than a year: long enough
    # that nobody downloads them twice, short enough that replacing a typeface actually lands.
    location /fonts/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    # Hashed filenames, so they can be cached hard. HTML never is.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.html$ { add_header Cache-Control "no-store"; }

    # The identity service, when it is running. Same origin, so the session cookie stays first-party
    # and the page's connect-src can stay 'self'. Commented out until TLS and an SMS provider exist:
    # a one-time-code service must not be reachable over plain http.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8787/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / { try_files $uri $uri/ /landing.html; }
}
