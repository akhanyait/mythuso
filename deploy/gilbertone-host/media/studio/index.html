<!doctype html>
<!--
  GilbertOne's studio: where the founder asks GilbertOne to draw, paint or animate (asked for on
  8 October 2026). Served by deploy/gilbertone-host/media behind the same login as the test chat, at
  /media/. It looks like the chat on purpose, with the same logo and colours, so it reads as one
  GilbertOne.
  It keeps nothing in the browser: no storage API, results held only by the server, for an hour. Every
  sentence about what is refused, labelled or kept comes from the service, which reads them from
  packages/catalog/gilbertone-media.json; this page types none of them. The script is a separate file
  because the page's Content-Security-Policy runs no inline script.
-->
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#083848">
<link rel="icon" href="/gilbert-icon.webp">
<link rel="apple-touch-icon" href="/gilbert-icon.webp">
<title>GilbertOne Studio</title>
<style>
  :root {
    --ink:#083848; --navy:#1e3a8a; --teal:#14b8a6; --green:#189870; --lime:#d8f818;
    --bg:#eef6f7; --surface:#ffffff; --text:#0f172a; --muted:#51616b; --line:#d6e4e7;
    --warn-bg:#fff6e5; --warn-ink:#8a4b06; --focus:#14b8a6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#071419; --surface:#0e1f26; --text:#e7f0f2; --muted:#93a8b0; --line:#1d343c; --warn-bg:#2a2112; --warn-ink:#ffcf8a; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; color:var(--text); min-height:100dvh;
    background:radial-gradient(120% 60% at 100% 0%, rgba(20,184,166,.16), transparent 60%), var(--bg);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%;
  }
  .app { max-width:780px; margin:0 auto; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  header {
    display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(120deg, var(--ink) 0%, #0b4a5c 55%, var(--navy) 130%); color:#fff;
  }
  .avatar { width:42px; height:42px; border-radius:50%; background:#fff; padding:3px; flex:none; box-shadow:0 0 0 2px rgba(216,248,24,.55); }
  .avatar img { width:100%; height:100%; border-radius:50%; display:block; }
  .title { flex:1; min-width:0; }
  .title b { display:block; font-size:18px; }
  .title span { font-size:13px; color:#bfe3e6; }
  .ghost { min-height:44px; padding:0 14px; border-radius:22px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.06); color:#fff; font-size:14px; display:inline-flex; align-items:center; text-decoration:none; }
  .notice { margin:12px 16px 0; padding:10px 14px; border-radius:14px; background:var(--warn-bg); color:var(--warn-ink); font-size:14px; line-height:1.4; }
  .notice p { margin:0; } .notice p + p { margin-top:6px; }
  main { padding:16px; display:flex; flex-direction:column; gap:14px; }
  .kinds { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .kind { min-height:64px; padding:10px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; text-align:left; }
  .kind b { display:block; font-size:15px; }
  .kind small { color:var(--muted); font-size:12px; }
  .kind[aria-pressed="true"] { border-color:var(--teal); box-shadow:0 0 0 2px var(--teal) inset; }
  .kind:disabled { opacity:.55; }
  .meaning { margin:0; color:var(--muted); font-size:14px; }
  textarea { width:100%; min-height:96px; padding:12px 16px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:inherit; font:inherit; resize:vertical; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:40px; padding:6px 14px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:14px; }
  .make { min-height:52px; border:0; border-radius:26px; background:linear-gradient(135deg, var(--teal), var(--green)); color:#fff; font:inherit; font-weight:600; font-size:17px; }
  .make:disabled { background:var(--line); color:var(--muted); }
  .card { padding:14px; border-radius:20px; background:var(--surface); border:1px solid var(--line); }
  .card.refused { border-color:#ffb347; }
  .step { display:flex; align-items:center; gap:10px; color:var(--muted); }
  .spinner { width:18px; height:18px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal); animation:spin 1s linear infinite; flex:none; }
  .result img, .result video { width:100%; height:auto; display:block; border-radius:12px; background:#fff; }
  .result p { margin:8px 0 0; font-size:14px; color:var(--muted); }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .actions a { min-height:44px; padding:0 16px; border-radius:22px; border:1px solid var(--line); display:inline-flex; align-items:center; color:var(--text); text-decoration:none; font-size:15px; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
  @media (max-width:420px) { .kind small { display:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar"><img src="/gilbert-icon.webp" alt="" width="36" height="36"></div>
    <div class="title"><b>GilbertOne Studio</b><span>Drawings, pictures and short videos</span></div>
    <a class="ghost" href="/">Chat</a>
  </header>
  <div class="notice" id="notice"><p id="preview"></p><p id="keeping"></p></div>
  <main>
    <div class="kinds" role="group" aria-label="What to make" id="kinds"></div>
    <p class="meaning" id="meaning"></p>
    <label for="words" hidden>What should GilbertOne make?</label>
    <textarea id="words" placeholder="Describe what you would like, in any language" maxlength="600"></textarea>
    <div class="chips" id="chips"></div>
    <button class="make" id="make" type="button" disabled>Make it</button>
    <section id="out" aria-live="polite"></section>
  </main>
</div>
<script src="studio.js"></script>
</body>
</html>
