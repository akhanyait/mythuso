# mythuso.co.za on lima-gateway-1, the shared gateway on 102.202.45.201. Installed by
# deploy/ngwempisi/deploy.sh as /etc/nginx/conf.d/mythuso.conf inside that container.
#
# The gateway does two things for this site and nothing else: it holds the certificate, and it hands
# every request to mythuso-site, which serves deploy/nginx/mythuso.conf. No header, cache rule or
# rate limit is set here, so the one file that decides them is the same on both boxes, and nothing
# here can reach any other server block on the gateway.
#
# The filename sorts after default.conf on purpose. nginx's default 443 server is the first one it
# loads, golima.co.za depends on being that server, and a file named to sort before it (as
# ci.mpumiworks.conf briefly did, 18 October 2026) takes every unmatched name.
#
# __CERT_DIR__ is filled in by the deploy: live/mythuso.co.za once certbot has issued on this box,
# or migrated/mythuso.co.za for the copy brought across from liqzar-server so the DNS switch has no
# moment without a valid certificate.

server {
    listen 80;
    server_name mythuso.co.za www.mythuso.co.za;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name mythuso.co.za www.mythuso.co.za;
    ssl_certificate     /etc/nginx/certs/__CERT_DIR__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/__CERT_DIR__/privkey.pem;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://mythuso-site:80;
        proxy_set_header Host $host;
        # mythuso-site trusts this header from the gateway's network only (set_real_ip_from), so
        # the /assistant/ rate limit counts each visitor, not the gateway.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The site's own ceilings, so the gateway is never the tighter one: 768k is the assistant's
        # body limit, and 20s its read timeout (both in deploy/nginx/mythuso.conf).
        client_max_body_size 768k;
        proxy_read_timeout 25s;
    }
}
